name: CI - Build - Windows

on:
  workflow_dispatch:
    inputs:
      generate_assets:
        type: boolean
        description: Generate assets
      checkout_pr:
        type: string
        description: Checkout PR
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Windows x64 is back on automatic PRs so testers can download a runnable
# tree (same idea as macOS compile uploading compiled.tar.gz). Installers
# (exe/msi) stay behind generate_assets, which only exists on
# workflow_dispatch — PR/push runs pack the portable folder and stop.
# arm64 packing is dispatch-only too: most Windows testers are x64, and a
# second pack job is real extra time. Linux stays workflow_dispatch-only.
#
# What keeps this affordable: generate_assets is the expensive installer
# step. The `build` job still has to run on PRs — unlike macOS, Windows
# `build.sh` skips gulp packing when CI_BUILD != no, so the runnable
# VSCode-win32-* tree is produced here, not in compile.

# P1: boxcode-ide only builds the "stable" quality for now — no insider
# channel yet. ASSETS_REPOSITORY is set explicitly (rather than relying on
# utils.sh's fallback) so a misconfigured run can never silently point at
# VSCodium's own release/update infrastructure.
env:
  APP_NAME: Boxcode
  ASSETS_REPOSITORY: ${{ github.repository }}
  BINARY_NAME: boxcode-ide
  DISABLE_UPDATE: yes
  GH_REPO_PATH: ${{ github.repository }}
  GITHUB_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.head }}
  ORG_NAME: ${{ github.repository_owner }}
  OS_NAME: windows
  VSCODE_QUALITY: stable
  SHOULD_BUILD_REH: 'no'
  SHOULD_BUILD_REH_WEB: 'no'

# boxcode-ide is private (unlike VSCodium's public repo, where an empty
# permissions block still allows read access) — GITHUB_TOKEN needs an
# explicit contents:read or actions/checkout can't even fetch the repo.
permissions:
  contents: read

jobs:
  # Same skip logic as macOS: don't spend a Windows runner on a PR that
  # cannot affect this build. Defaults to relevant on push/dispatch or if
  # git diff fails.
  changes:
    runs-on: ubuntu-latest
    outputs:
      build-relevant: ${{ steps.check.outputs.relevant }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: check
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "not a pull_request event (push/workflow_dispatch) - always running the real build"
            exit 0
          fi

          CHANGED="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")" || {
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "git diff failed - defaulting to relevant, not risking a false negative"
            exit 0
          }
          echo "Changed files:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -qE '^(get_repo\.sh|get_pr\.sh|build\.sh|version\.sh|prepare_vscode\.sh|prepare_assets\.sh|utils\.sh|build_cli\.sh|product\.json|\.nvmrc|patches/|src/|build/|icons/|\.github/workflows/ci-build-windows\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "a build-relevant path changed"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "nothing build-relevant changed - skipping the real build"
          fi

  compile:
    # Explicit name: Windows and Linux each have their own job literally
    # named "compile" - without a display name they'd both report an
    # identically-named check, which is exactly the kind of ambiguity that
    # makes required-status-check matching in branch protection unreliable.
    name: compile (windows)
    needs: changes
    if: needs.changes.outputs.build-relevant == 'true'
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      VSCODE_ARCH: 'x64'
    outputs:
      BUILD_SOURCEVERSION: ${{ steps.build-info.outputs.BUILD_SOURCEVERSION }}
      MS_COMMIT: ${{ steps.build-info.outputs.MS_COMMIT }}
      MS_TAG: ${{ steps.build-info.outputs.MS_TAG }}
      RELEASE_VERSION: ${{ steps.build-info.outputs.RELEASE_VERSION }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.GITHUB_BRANCH }}
          persist-credentials: false

      - name: Switch to relevant branch
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
        run: ./get_pr.sh

      - name: Setup Node.js environment
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Setup Python 3
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Clone VSCode repo
        run: ./get_repo.sh

      # get_repo.sh has just produced vscode/**/package-lock.json and
      # vscode/cli/Cargo.lock from the freshly-cloned upstream tree, so this
      # has to run after it, not alongside actions/setup-node earlier in this
      # job (those lockfiles don't exist yet at that point). A cache-key miss
      # here just falls back to a normal full install/compile, never breaks
      # the build - so an imprecise hashFiles glob is a safe failure mode.
      # Compile is x64-only (no matrix); the previous key used
      # matrix.vscode_arch, which is empty here and split the cache from
      # the pack job for no reason.
      - name: Cache npm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-x64-npm-${{ hashFiles('vscode/**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-x64-npm-

      - name: Cache cargo registry and CLI build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vscode/cli/target
          key: ${{ runner.os }}-x64-cargo-${{ hashFiles('vscode/cli/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-x64-cargo-

      - name: Build
        env:
          SHOULD_BUILD: yes
          SHOULD_BUILD_REH: no
          SHOULD_BUILD_REH_WEB: no
        run: ./build.sh

      - id: build-info
        run: |
          echo "BUILD_SOURCEVERSION=${BUILD_SOURCEVERSION}" >> "$GITHUB_OUTPUT"
          echo "MS_COMMIT=${MS_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "MS_TAG=${MS_TAG}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Compress vscode artifact
        run: |
          find vscode -type f -not -path "*/node_modules/*" -not -path "vscode/.build/node/*" -not -path "vscode/.git/*" > vscode.txt
          echo "vscode/.build/extensions/node_modules" >> vscode.txt
          echo "vscode/.git" >> vscode.txt
          tar -czf vscode.tar.gz -T vscode.txt

      - name: Upload vscode artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode
          path: ./vscode.tar.gz
          retention-days: 1

  # Named `build` (not `package`) because Windows compile does not gulp-pack
  # the app — that happens here via package.sh. Always uploads the portable
  # VSCode-win32-* tree so a PR has something a Windows tester can run.
  # exe/msi still sit behind generate_assets.
  build:
    name: pack (windows-${{ matrix.vscode_arch }})
    needs:
      - changes
      - compile
    if: needs.changes.outputs.build-relevant == 'true'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        vscode_arch: ${{ github.event.inputs.generate_assets == 'true' && fromJSON('["x64","arm64"]') || fromJSON('["x64"]') }}
    defaults:
      run:
        shell: bash
    env:
      BUILD_SOURCEVERSION: ${{ needs.compile.outputs.BUILD_SOURCEVERSION }}
      MS_COMMIT: ${{ needs.compile.outputs.MS_COMMIT }}
      MS_TAG: ${{ needs.compile.outputs.MS_TAG }}
      RELEASE_VERSION: ${{ needs.compile.outputs.RELEASE_VERSION }}
      SHOULD_BUILD_REH: no
      SHOULD_BUILD_REH_WEB: no
      VSCODE_ARCH: ${{ matrix.vscode_arch }}
    outputs:
      RELEASE_VERSION: ${{ needs.compile.outputs.RELEASE_VERSION }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.GITHUB_BRANCH }}
          persist-credentials: false

      - name: Switch to relevant branch
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
        run: ./get_pr.sh

      - name: Setup Node.js environment
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Setup Python 3
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Download vscode artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode

      - name: Build
        env:
          DISABLE_MSI: ${{ vars[format('DISABLE_{0}_MSI', ((github.ref == 'refs/heads/insider' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'insider')) && 'INSIDER' || 'STABLE'))] }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.vscode_arch }}
          npm_config_target_arch: ${{ matrix.vscode_arch }}
        run: ./build/windows/package.sh

      # Same tar-then-upload pattern as macOS: a single file so
      # upload-artifact cannot flatten the tree. Windows testers extract
      # and run Boxcode.exe from VSCode-win32-<arch>.
      - name: Archive compiled build output
        run: |
          tar -czf compiled.tar.gz \
            "VSCode-win32-${VSCODE_ARCH}" \
            vscode/product.json

      - name: Upload compiled build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiled-win32-${{ matrix.vscode_arch }}
          path: compiled.tar.gz
          retention-days: 1

      - name: Prepare assets
        run: ./prepare_assets.sh
        if: github.event.inputs.generate_assets == 'true'

      - name: Prepare checksums
        run: ./prepare_checksums.sh
        if: github.event.inputs.generate_assets == 'true'

      - name: Upload assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.vscode_arch }}
          path: assets/
          retention-days: 3
        if: github.event.inputs.generate_assets == 'true'
