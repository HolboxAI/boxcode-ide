name: CI - Build - macOS

on:
  workflow_dispatch:
    inputs:
      generate_assets:
        type: boolean
        description: Generate assets
      checkout_pr:
        type: string
        description: Checkout PR
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"

# Correction to an earlier version of this comment: this workflow was made
# manual-only to cut CI noise/cost during P1 debugging, but that also meant
# NO automatic signal at all on whether the app actually builds - a PR could
# show "all checks passed" (hygiene only) while the real build was known
# broken. That's a worse failure mode than the noise it was avoiding. A red
# check that takes an hour beats a false green one.
#
# Restored automatic pull_request triggering. What actually keeps this
# affordable: `generate_assets` (the expensive packaging/installer step) is
# a workflow_dispatch-only input, so github.event.inputs.generate_assets is
# empty/falsy on every pull_request-triggered run - packaging stays skipped
# automatically (the `package` job below is gated on it directly), only the
# real compile+typecheck runs. That job is `compile` (reports as "compile
# (<runner>, <arch>)" per matrix leg - renamed from "build" when packaging
# was split into its own job, see the `package` job's comment) and is what
# should be made a required status check in branch protection, once its
# exact name is confirmed reporting on a real run - see docs/BACKLOG.md.

# P1: boxcode-ide only builds the "stable" quality for now — no insider
# channel yet. ASSETS_REPOSITORY is set explicitly (rather than relying on
# utils.sh's fallback) so a misconfigured run can never silently point at
# VSCodium's own release/update infrastructure.
env:
  APP_NAME: Boxcode
  ASSETS_REPOSITORY: ${{ github.repository }}
  BINARY_NAME: boxcode-ide
  DISABLE_UPDATE: yes
  GH_REPO_PATH: ${{ github.repository }}
  GITHUB_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.head }}
  ORG_NAME: ${{ github.repository_owner }}
  OS_NAME: osx
  VSCODE_QUALITY: stable

# boxcode-ide is private (unlike VSCodium's public repo, where an empty
# permissions block still allows read access) — GITHUB_TOKEN needs an
# explicit contents:read or actions/checkout can't even fetch the repo.
permissions:
  contents: read

jobs:
  # Skip the ~1.5-2.5h real build for PRs that can't possibly affect it -
  # e.g. a one-line bash-conditional fix in prepare_assets.sh (never even
  # exercised by this required check, since generate_assets is off on every
  # automatic PR run) or a rename in a file confirmed unused by the build.
  # Path list below was NOT guessed - it's the actual sourcing graph of the
  # scripts this job runs (grepped: build.sh sources version.sh,
  # prepare_vscode.sh, build_cli.sh; prepare_vscode.sh sources utils.sh and
  # reads product.json + patches/**). Deliberately conservative: on a push
  # to main, a workflow_dispatch, or a diff-computation failure of any kind,
  # this defaults to "relevant" (run the real build) rather than risk a
  # false negative letting a real breakage merge unverified.
  changes:
    runs-on: ubuntu-latest
    outputs:
      build-relevant: ${{ steps.check.outputs.relevant }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: check
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "not a pull_request event (push/workflow_dispatch) - always running the real build"
            exit 0
          fi

          CHANGED="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")" || {
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "git diff failed - defaulting to relevant, not risking a false negative"
            exit 0
          }
          echo "Changed files:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -qE '^(get_repo\.sh|get_pr\.sh|build\.sh|version\.sh|prepare_vscode\.sh|utils\.sh|build_cli\.sh|product\.json|\.nvmrc|patches/|\.github/workflows/ci-build-macos\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "a build-relevant path changed"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "nothing build-relevant changed - skipping the real build"
          fi

  # Split from a single "build" job that always did compile-then-package in
  # one shot. Every packaging-only bug (create-dmg's default codesign
  # lookup, the SHOULD_BUILD gate, whatever's next) used to cost a full
  # ~50min recompile just to test a one-line script fix, because nothing
  # from a finished compile ever survived past that job's ephemeral runner -
  # generate_assets was off on every automatic run, so upload-artifact never
  # fired, and even when it did it only kept the final zip/dmg, not the raw
  # VSCode-darwin-*/ build output prepare_assets.sh actually needs. Now
  # compile always uploads its raw output (short retention - this is a
  # same-run relay, not long-term storage), so a packaging-only failure can
  # be fixed and re-verified via GitHub's "re-run failed jobs" without
  # recompiling: that reuses this job's artifact instead of re-running it.
  compile:
    needs: changes
    if: needs.changes.outputs.build-relevant == 'true'
    runs-on: ${{ matrix.runner }}
    env:
      VSCODE_ARCH: ${{ matrix.vscode_arch }}
    # A matrixed job's outputs are only well-defined when exactly one leg
    # sets them - with multiple legs, whichever leg finishes last wins,
    # silently. Safe today because there's a single arm64 leg (matches the
    # single-leg assumption already documented elsewhere in this file, e.g.
    # the release-publish step below); revisit this whole outputs/package
    # split if a second arch leg ever comes back into scope.
    outputs:
      release_version: ${{ steps.release-info.outputs.release_version }}
      vscode_arch: ${{ matrix.vscode_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            vscode_arch: arm64

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.GITHUB_BRANCH }}
          persist-credentials: false

      - name: Switch to relevant branch
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
        run: . get_pr.sh

      - name: Setup Node.js environment
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      # No longer gated on VSCODE_ARCH == 'x64' - that condition meant this
      # step would never run at all once the x64 matrix leg was removed
      # (arm64-only now). Was presumably x64-only because VSCodium ran both
      # arches and one of them had Python 3.11 preinstalled already; running
      # it unconditionally is the safe choice - redundant setup on an arch
      # that already has it costs nothing, skipping it on an arch that needs
      # it breaks the build (Python is used for native module compilation).
      - name: Setup Python 3
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Clone VSCode repo
        run: . get_repo.sh

      # get_repo.sh has just produced vscode/**/package-lock.json and
      # vscode/cli/Cargo.lock from the freshly-cloned upstream tree, so this
      # has to run after it, not alongside actions/setup-node earlier in this
      # job (those lockfiles don't exist yet at that point). A cache-key miss
      # here just falls back to a normal full install/compile, never breaks
      # the build - so an imprecise hashFiles glob is a safe failure mode.
      - name: Cache npm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ matrix.vscode_arch }}-npm-${{ hashFiles('vscode/**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.vscode_arch }}-npm-

      - name: Cache cargo registry and CLI build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vscode/cli/target
          key: ${{ runner.os }}-${{ matrix.vscode_arch }}-cargo-${{ hashFiles('vscode/cli/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.vscode_arch }}-cargo-

      # SHOULD_BUILD used to be set only inside this step's own `env:` block,
      # which is invisible to later steps' `if: env.SHOULD_BUILD == ...`
      # conditions - a step-level `env:` only sets that step's shell
      # environment, it's never merged into the `env` expression context
      # later steps evaluate (that only picks up job-level `env:` or actual
      # $GITHUB_ENV writes, neither of which this workflow does for
      # SHOULD_BUILD - check_tags.sh/check_cron_or_pr.sh do write it to
      # $GITHUB_ENV, but neither is called anywhere in this workflow). Real
      # bug, not a guess: confirmed by grep that SHOULD_BUILD is written to
      # GITHUB_ENV nowhere this workflow's call graph touches. Net effect:
      # "Prepare assets"/"Upload assets"/"Publish" below always evaluated
      # env.SHOULD_BUILD as empty/false and silently no-op'd, regardless of
      # generate_assets - this is why no dmg/zip/release was ever produced,
      # not build time. Since this job never has a real "don't build" path
      # (SHOULD_BUILD is a hardcoded literal here, not conditional), the
      # check was always dead weight even before being broken - dropped it
      # rather than plumbing it through GITHUB_ENV, and gate on
      # generate_assets alone, which is the condition that actually matters.
      - name: Build
        env:
          SHOULD_BUILD: yes
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.sh

      # version.sh (sourced by build.sh) writes RELEASE_VERSION to
      # $GITHUB_ENV, which makes it available to this and later steps in
      # THIS job as a real shell env var - but that's job-scoped, it doesn't
      # cross into the separate `package` job below. Re-exporting it as a
      # step output is the actual mechanism that does cross jobs (via
      # needs.compile.outputs), same idea as the SHOULD_BUILD fix above:
      # know which GitHub Actions context you're relying on, don't assume
      # env just carries over.
      - id: release-info
        run: echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"

      # Real bug, found by a user hitting it, not a guess: actions/upload-
      # artifact does not reliably preserve Unix executable permissions when
      # it walks and re-zips a whole directory tree. Confirmed directly on a
      # real download - every single file in the .app bundle (5,352 of them)
      # came out with the execute bit stripped, which is exactly why macOS
      # showed a bare "Boxcode IDE can't be opened" with no further detail:
      # LaunchServices can't even attempt to run a non-executable file, so it
      # never gets far enough to show a Gatekeeper dialog. Standard fix for
      # this class of GitHub Actions gotcha: tar the tree into one opaque
      # file ourselves first (tar preserves modes/symlinks exactly) and let
      # upload-artifact carry that single file, rather than letting the
      # action's own directory-walking repackage (and silently flatten the
      # permissions on) an Electron .app full of executables.
      #
      # Minimal set of paths prepare_assets.sh needs in the tarball,
      # confirmed by grep, not guessed: the app bundle + REH/REH-web bundles
      # build.sh produces, plus vscode/product.json (the only vscode/ file
      # prepare_assets.sh reads, for applicationName/nameLong/
      # tunnelApplicationName - not the whole vscode/ tree, which would drag
      # along node_modules and be enormous). Always created (not gated on
      # generate_assets) - this is the actual fix for "why redo compile just
      # to test a packaging fix".
      - name: Archive compiled build output
        run: |
          tar -czf compiled.tar.gz \
            "VSCode-darwin-${VSCODE_ARCH}" \
            "vscode-reh-darwin-${VSCODE_ARCH}" \
            "vscode-reh-web-darwin-${VSCODE_ARCH}" \
            vscode/product.json

      # Short retention: this is a same-run relay to the package job, not
      # meant as long-term storage.
      - name: Upload compiled build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiled-${{ matrix.vscode_arch }}
          path: compiled.tar.gz
          retention-days: 1

  # Split out so a packaging-only bug (create-dmg, prepare_assets.sh, the
  # release-publish step) can be fixed and re-verified via "re-run failed
  # jobs" in the Actions UI without paying for another ~50min compile -
  # that reuses compile's artifact instead of re-running compile. Only
  # meaningful on workflow_dispatch (generate_assets doesn't exist as an
  # input on pull_request/push-triggered runs, so this is skipped there by
  # construction, same as the old single-job gate was).
  package:
    needs: [changes, compile]
    if: needs.changes.outputs.build-relevant == 'true' && github.event.inputs.generate_assets == 'true'
    runs-on: macos-latest
    # Job-level permissions override the workflow-level `contents: read`
    # above (which exists for a different reason - private-repo checkout in
    # the changes/compile jobs). Creating a GitHub release needs
    # `contents: write`. Real failure, not a guess: the last run's "Publish"
    # step got "release not found" from `gh release upload`, because `gh
    # release create` had already failed (403, no write access) one line
    # earlier - masked by that line's own `2>/dev/null || true`, which was
    # meant as a race-condition safety net for a different scenario (two
    # matrix legs both trying to create the same release), not as cover for
    # a permissions failure. Scoped to just this job, not the whole
    # workflow, since changes/compile only ever need to read.
    permissions:
      contents: write
    env:
      VSCODE_ARCH: ${{ needs.compile.outputs.vscode_arch }}
      RELEASE_VERSION: ${{ needs.compile.outputs.release_version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.GITHUB_BRANCH }}
          persist-credentials: false

      - name: Download compiled build output
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: compiled-${{ needs.compile.outputs.vscode_arch }}

      # See "Archive compiled build output" in the compile job above for why
      # this is a single tarball rather than letting upload/download-artifact
      # walk the directory tree directly - extracting with tar (not
      # unzip/download-artifact's own extraction) is what actually restores
      # the executable bits tar preserved on the way in.
      - name: Extract compiled build output
        run: tar -xzf compiled.tar.gz

      - name: Prepare assets
        run: ./prepare_assets.sh

      - name: Upload assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ needs.compile.outputs.vscode_arch }}
          path: assets/
          retention-days: 3

      # Testers shouldn't have to dig through an Actions run page to find a
      # zip - one stable, bookmarkable link instead. The `gh release create
      # ... || true` pattern is a leftover safety net from when this ran on
      # two parallel matrix legs racing to create the same release -
      # harmless now with a single arm64 leg, left as-is since it's still
      # correct (idempotent create), just no longer load-bearing. Re-add a
      # second leg's worth of care here if x64 ever comes back into scope.
      # No code-signing/notarization exists yet (open decision, see
      # README.md), so this is explicitly labeled an unsigned dev build -
      # macOS Gatekeeper will warn on first launch, which is expected until
      # that's set up for real.
      - name: Publish to the rolling macOS dev-build release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="macos-dev-latest"
          gh release create "$TAG" --repo "${{ github.repository }}" \
            --title "macOS dev build (rolling)" \
            --notes "Unsigned dev build, updated on every manual CI run with asset generation enabled. Not for public distribution - Gatekeeper will warn on first launch (right-click → Open, or \`xattr -d com.apple.quarantine\`)." \
            --prerelease 2>/dev/null || true
          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber assets/*.zip assets/*.dmg
