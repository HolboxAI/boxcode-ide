name: covexcode-ide
adopt-info: covexcode-ide
summary: Code editing. Redefined.
description: |
  Binary releases of covexcode-ide, a Code-OSS based editor for covexcode,
  without Microsoft branding, telemetry, or licensing.

base: core20
grade: stable
confinement: classic
compression: lzo

parts:
  covexcode-ide:
    plugin: nil
    override-build: |
      set -eu
      # Get .deb url from the latest versioned release
      wget --quiet https://api.github.com/repos/HolboxAI/boxcode-ide/releases/latest -O release.json
      DEB_URL=$( jq -r '.assets[].browser_download_url|select(endswith("'"_${SNAPCRAFT_TARGET_ARCH}.deb"'"))' release.json )
      DEB_NAME=$( basename "${DEB_URL}" )
      # Set version from the .deb filename (the release tag is not a version)
      VERSION=$( printf '%s' "${DEB_NAME}" | sed -n 's/^covexcode-ide_\(.*\)_'"${SNAPCRAFT_TARGET_ARCH}"'\.deb$/\1/p' )
      snapcraftctl set-version "${VERSION}"
      # Downloading .deb
      wget "${DEB_URL}" -O "${SNAPCRAFT_PART_INSTALL}/${DEB_NAME}"
      # Unpacking .deb
      dpkg -x "${SNAPCRAFT_PART_INSTALL}/${DEB_NAME}" "${SNAPCRAFT_PART_INSTALL}"
      # Clean up
      rm -f release.json
      rm -f "${SNAPCRAFT_PART_INSTALL}/${DEB_NAME}"
      # Prepare GUI
      mkdir -p "${SNAPCRAFT_PART_INSTALL}/meta/gui"
      cp "${SNAPCRAFT_PART_INSTALL}/usr/share/covexcode-ide/resources/app/resources/linux/code.png" "${SNAPCRAFT_PART_INSTALL}/meta/gui/covexcode-ide.png"
      # Update paths
      sed -i 's|Exec=/usr/share/covexcode-ide/covexcode-ide|Exec=covexcode-ide --force-user-env|g' "${SNAPCRAFT_PART_INSTALL}/usr/share/applications/covexcode-ide.desktop"
      sed -i 's|Exec=/usr/share/covexcode-ide/covexcode-ide|Exec=covexcode-ide --force-user-env|g' "${SNAPCRAFT_PART_INSTALL}/usr/share/applications/covexcode-ide-url-handler.desktop"
      sed -i 's|Icon=covexcode-ide|Icon=${SNAP}/meta/gui/covexcode-ide.png|g' "${SNAPCRAFT_PART_INSTALL}/usr/share/applications/covexcode-ide.desktop"
      sed -i 's|Icon=covexcode-ide|Icon=${SNAP}/meta/gui/covexcode-ide.png|g' "${SNAPCRAFT_PART_INSTALL}/usr/share/applications/covexcode-ide-url-handler.desktop"
    build-packages:
      - wget
      - jq
    stage-packages:
      - ca-certificates
      - libasound2
      - libatk-bridge2.0-0
      - libatk1.0-0
      - libatspi2.0-0
      - libcairo2
      - libcanberra-gtk3-module
      - libcurl3-gnutls
      - libcurl3-nss
      - libcurl4
      - libdrm2
      - libgbm1
      - libgl1
      - libglib2.0-0
      - libgtk-3-0
      - libibus-1.0-5
      - libnss3
      - libpango-1.0-0
      - libsecret-1-0
      - libwayland-egl1
      - libxcomposite1
      - libxdamage1
      - libxfixes3
      - libxkbcommon0
      - libxkbfile1
      - libxrandr2
      - libxss1
      - locales-all
      - packagekit-gtk3-module
      - xdg-utils
    prime:
      - -usr/share/doc
      - -usr/share/fonts
      - -usr/share/icons
      - -usr/share/lintian
      - -usr/share/man
      - -usr/share/covexcode-ide/chrome-sandbox
    build-attributes:
      - enable-patchelf
    override-prime: |
      set -eux
      snapcraftctl prime
      for snap in "core20"; do
        cd "/snap/${snap}/current/usr/lib/${SNAPCRAFT_ARCH_TRIPLET}"
        find . -type f,l -name "*.so*" -exec bash -c "rm -f ${SNAPCRAFT_PRIME}/{}*" \;
      done

  electron-launch:
    after:
      - covexcode-ide
    plugin: dump
    source: snap/local/bin

apps:
  covexcode-ide:
    command: electron-launch $SNAP/usr/share/covexcode-ide/bin/covexcode-ide --no-sandbox
    desktop: usr/share/applications/covexcode-ide.desktop
    common-id: covexcode-ide.desktop

  url-handler:
    command: electron-launch $SNAP/usr/share/covexcode-ide/bin/covexcode-ide --open-url --no-sandbox
    desktop: usr/share/applications/covexcode-ide-url-handler.desktop
